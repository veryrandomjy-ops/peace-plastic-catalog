<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beer Tower / Tap Tower 产品目录</title>
<style>
  :root {
    --amber:#E8A33D; --amber-d:#C8821C; --gold:#F2C879;
    --ink:#1c140a; --dark:#241a0e; --paper:#fbf6ec; --line:#e7dcc6;
    --muted:#8a7a5f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.5; }
  a { color:inherit; text-decoration:none; }

  /* ---------- COVER ---------- */
  .cover { position:relative; min-height:92vh; display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #3a2a12 0%, #1c140a 60%, #120c05 100%);
    color:#fff; padding:48px 24px; }
  .cover::before { content:""; position:absolute; inset:0;
    background:
      radial-gradient(60% 50% at 50% 120%, rgba(232,163,61,.35), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 22px); }
  .cover .kicker { letter-spacing:.5em; font-size:13px; color:var(--gold); text-transform:uppercase;
    border:1px solid rgba(242,200,121,.5); padding:8px 18px; border-radius:30px; position:relative; }
  .cover h1 { font-size:clamp(38px,7vw,82px); margin:26px 0 6px; font-weight:800;
    background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text;
    background-clip:text; color:transparent; letter-spacing:.02em; position:relative; }
  .cover .sub { font-size:clamp(15px,2.4vw,22px); color:#f3e4c5; position:relative; }
  .cover .tap { font-size:64px; margin:10px 0 4px; position:relative; filter:drop-shadow(0 6px 18px rgba(232,163,61,.5)); }
  .cover .meta { margin-top:34px; display:flex; gap:28px; flex-wrap:wrap; justify-content:center;
    position:relative; color:#e9dcc0; font-size:14px; }
  .cover .meta div { background:rgba(255,255,255,.06); border:1px solid rgba(242,200,121,.25);
    padding:12px 18px; border-radius:12px; min-width:160px; }
  .cover .meta b { display:block; color:var(--gold); font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; margin-bottom:4px; font-weight:600; }
  .cover .foot { position:absolute; bottom:18px; font-size:12px; color:#9c8a68; letter-spacing:.2em; }

  /* ---------- LAYOUT ---------- */
  .wrap { max-width:1200px; margin:0 auto; padding:0 22px; }
  section { padding:54px 0; }
  .sec-title { display:flex; align-items:baseline; gap:14px; margin-bottom:8px; }
  .sec-title h2 { font-size:30px; margin:0; color:var(--dark); }
  .sec-title .en { color:var(--amber-d); font-size:14px; letter-spacing:.2em; text-transform:uppercase; }
  .sec-line { height:3px; background:linear-gradient(90deg,var(--amber),transparent);
    border-radius:3px; margin:10px 0 30px; }
  .lead { color:var(--muted); margin:0 0 26px; max-width:760px; }

  /* ---------- CARDS ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 6px 20px rgba(60,40,10,.07); display:flex; flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform:translateY(-4px); box-shadow:0 14px 34px rgba(60,40,10,.16); }
  .card-head { display:flex; align-items:center; gap:10px; padding:14px 16px 10px;
    background:linear-gradient(90deg,#fff7e8,#fff); border-bottom:1px solid var(--line); }
  .card-head .idx { font-size:12px; color:#fff; background:var(--amber); border-radius:20px;
    padding:3px 10px; font-weight:700; }
  .card-head .item { font-size:19px; font-weight:800; color:var(--dark); letter-spacing:.02em; }
  .card-photo { height:190px; background:#f1ece0; display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-bottom:1px solid var(--line); }
  .card-photo img { width:100%; height:100%; object-fit:contain; }
  .card-photo.ph .ph-icon { font-size:46px; opacity:.35; }
  .swatches { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px;
    background:#fffaf0; border-top:1px solid var(--line); }
  .swatch { width:20px; height:20px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .swatch.on { box-shadow:0 0 0 2px var(--amber); transform:scale(1.14); }
  .cname { font-size:12px; font-weight:700; color:var(--amber-d); background:#fff3df;
    border:1px solid #f0d9af; border-radius:20px; padding:2px 10px; }
  .sw-label { font-size:11px; color:var(--muted); margin-left:2px; }
  .card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .specs { display:flex; flex-direction:column; gap:6px; }
  .spec { display:flex; justify-content:space-between; gap:12px; font-size:13px;
    border-bottom:1px dashed #efe6d3; padding-bottom:5px; }
  .spec .sk { color:var(--muted); white-space:nowrap; }
  .spec .sv { color:var(--ink); text-align:right; font-weight:600; }
  .price-block { margin-top:auto; background:#fff8ec; border:1px solid #f0e2c4; border-radius:12px;
    padding:10px 12px; }
  .pb-title { font-size:11px; color:var(--amber-d); text-transform:uppercase; letter-spacing:.12em;
    margin-bottom:6px; font-weight:700; }
  .tiers { display:flex; flex-wrap:wrap; gap:8px; }
  .tier { display:flex; flex-direction:column; align-items:center; background:#fff;
    border:1px solid #ecd9af; border-radius:9px; padding:5px 12px; min-width:78px; }
  .t-price { font-weight:800; color:var(--dark); font-size:16px; }
  .t-moq { font-size:11px; color:var(--muted); }
  .t-price.muted { color:var(--muted); font-size:13px; font-weight:600; }

  /* ---------- GALLERY ---------- */
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .g-item { border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#fff;
    aspect-ratio:1/1; display:block; transition:transform .15s; }
  .g-item:hover { transform:scale(1.03); }
  .g-item img { width:100%; height:100%; object-fit:cover; display:block; }

  /* 点击放大灯箱 */
  .card-photo.clickable { cursor:zoom-in; }
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;}
  .lightbox .lb-img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6);background:#fff;}
  .lightbox .lb-close{position:absolute;top:16px;right:24px;font-size:40px;line-height:1;color:#fff;cursor:pointer;opacity:.85;}
  .lightbox .lb-close:hover{opacity:1;}
  .lightbox .lb-prev,.lightbox .lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:54px;line-height:1;color:#fff;cursor:pointer;opacity:.65;padding:0 18px;user-select:none;}
  .lightbox .lb-prev{left:6px;}
  .lightbox .lb-next{right:6px;}
  .lightbox .lb-prev:hover,.lightbox .lb-next:hover{opacity:1;}
  .lightbox .lb-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:20px;}

  /* ---------- FOOTER ---------- */
  footer { background:var(--dark); color:#e9dcc0; padding:34px 22px; text-align:center; font-size:13px; }
  footer b { color:var(--gold); }

  /* ---------- PRINT ---------- */
  @media print {
    * { -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
    .lang-bar { display:none!important; }
    .cover { min-height:100vh; page-break-after:always; }
    .card { break-inside:avoid; box-shadow:none; }
    .g-item { break-inside:avoid; }
    section { padding:24px 0; }
  }
  /* ---------- 语言切换 ---------- */
  .lang-bar { position:fixed; top:14px; right:16px; z-index:10000; display:flex; gap:6px;
    background:rgba(28,20,10,.82); padding:5px; border-radius:30px; box-shadow:0 6px 20px rgba(0,0,0,.3); }
  .lang-bar button { border:0; background:transparent; color:#e9dcc0; font-size:13px;
    padding:6px 12px; border-radius:20px; cursor:pointer; font-family:inherit; }
  .lang-bar button.on { background:var(--amber); color:#1c140a; font-weight:700; }
</style>
</head>
<body>

  <div class="lang-bar" id="langBar"></div>

  <!-- ============ 渲染区：内容全部来自 catalog-data.js，无需修改此处 ============ -->
  <header class="cover" id="cover"></header>

  <section>
    <div class="wrap">
      <div class="sec-title"><h2 id="catZh">产品目录</h2><span class="en" id="catEn">Product Catalog</span></div>
      <div class="sec-line"></div>
      <p class="lead" id="intro"></p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section style="background:#fffaf0;">
    <div class="wrap">
      <div class="sec-title"><h2 id="galZh">实拍图廊</h2><span class="en" id="galEn">Photo Gallery</span></div>
      <div class="sec-line"></div>
      <p class="lead" id="galleryLead"></p>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <footer id="footer"></footer>

  <!-- 可编辑数据文件：改这里的内容，保存后刷新本页面即可 -->
  <script src="catalog-data.js"></script>
  <script src="i18n.js"></script>
  <script>
  (function () {
    const C = (typeof CATALOG !== 'undefined') ? CATALOG : (window.CATALOG || null);
    if (!C) { document.body.innerHTML = '<p style="padding:40px">未找到 catalog-data.js，请确认该文件与本页面在同一目录。</p>'; return; }
    const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const imgUrl = n => (!n ? '' : (n.indexOf('data:') === 0 ? n : 'assets/photos/' + n));
    function primaryPhoto(p){
      if(p.colors && p.colors.length){
        const c = p.colors[0];
        if(c && c.photos && c.photos.length) return c.photos[0];
        if(c && c.photo) return c.photo;
      }
      if(p.photos && p.photos.length) return p.photos[0];
      return p.photo || '';
    }
    // 收集某产品的全部图片（含所有颜色/视角），用于灯箱浏览
    function collectProductPhotos(p){
      const arr = [];
      const push = n => { if(n) arr.push({src: imgUrl(n), alt: p.item || ''}); };
      if(p.colors && p.colors.length){
        p.colors.forEach(c => {
          if(c.photos && c.photos.length) c.photos.forEach(push);
          else if(c.photo) push(c.photo);
        });
      }
      if(!arr.length){
        if(p.photos && p.photos.length) p.photos.forEach(push);
        else if(p.photo) push(p.photo);
      }
      return arr;
    }
    // 规格属性：兼容旧固定字段与新 specs 数组；返回结构化 {labelSrc,labelEn,valueSrc,valueEn}
    function normSpecs(p){
      if(Array.isArray(p.specs)){
        return p.specs.map(function(s){
          return { labelSrc:s.label, labelEn:s.label_en||'', valueSrc:s.value, valueEn:s.value_en||'' };
        });
      }
      const map=[{zh:'容量',en:'Capacity',key:'capacity'},{zh:'材质',en:'Material',key:'material'},
                 {zh:'规格',en:'Size',key:'desc'},{zh:'包装',en:'Packing',key:'packing'},
                 {zh:'外箱',en:'MEAS',key:'meas'},{zh:'毛/净重',en:'N.W/G.W',key:'weight'},{zh:'装柜',en:'Load',key:'load'}];
      return map.filter(function(o){ return p[o.key]!=null && p[o.key]!==''; })
                .map(function(o){ return { labelSrc:o.zh, labelEn:o.en, valueSrc:p[o.key], valueEn:p[o.key+'_en'] }; });
    }

    function renderCatalog(){
    // ---- Cover ----
    const b = C.brand || {};
    document.getElementById('cover').innerHTML = `
      <div class="kicker">${esc(b.name || 'Brand')}</div>
      <div class="tap">🍺</div>
      <h1>${esc(L(C.title && C.title.zh || 'BEER TOWER CATALOG', C.title && C.title.en))}</h1>
      <div class="sub">${esc(C.title && C.title.en || 'Tap Tower Product Catalog')}</div>
      <div class="meta">
        ${b.contact ? `<div><b>Contact</b>${esc(b.contact)}</div>` : ''}
        ${b.tel ? `<div><b>Tel</b>${esc(b.tel)}</div>` : ''}
        ${b.fax ? `<div><b>Fax</b>${esc(b.fax)}</div>` : ''}
        ${b.mob ? `<div><b>Mob</b>${esc(b.mob)}</div>` : ''}
        ${b.web ? `<div><b>Web</b>${esc(b.web)}</div>` : ''}
        ${b.email ? `<div><b>Email</b>${esc(b.email)}</div>` : ''}
      </div>
      <div class="foot">${esc(b.name || '')} · ${esc(C.year || '')} PRODUCT CATALOG</div>`;
    document.getElementById('catZh').textContent = t('products');
    document.getElementById('catEn').textContent = 'Product Catalog';
    document.getElementById('catEn').style.display = (getLang()==='en') ? 'none' : '';
    document.getElementById('galZh').textContent = t('gallery');
    document.getElementById('galEn').textContent = 'Photo Gallery';
    document.getElementById('galEn').style.display = (getLang()==='en') ? 'none' : '';

    // ---- Intro ----
    const products = C.products || [];
    document.getElementById('intro').innerHTML = L(C.intro || '', C.intro_en || '').replace(/\{n\}/g, products.length);

    // ---- Product cards（按 产品×颜色 展平为独立卡片）----
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const viewItems = [];
    products.forEach((p, pi) => {
      if (p.colors && p.colors.length) {
        p.colors.forEach((c, ci) => viewItems.push({ p, pi, ci, color: c }));
      } else {
        viewItems.push({ p, pi, ci: null, color: null });
      }
    });
    viewItems.forEach((it, vi) => {
      const p = it.p, color = it.color;
      const specsArr = normSpecs(p);
      const specHtml = specsArr.map(s =>
        `<div class="spec"><span class="sk">${esc(L(s.labelSrc, s.labelEn))}</span><span class="sv">${esc(L(s.valueSrc, s.valueEn))}</span></div>`).join('');

      const tiers = (p.prices || []).filter(t => t && (t.price || t.moq));
      let priceHtml;
      if (tiers.length) {
        priceHtml = tiers.map(t =>
          `<div class="tier"><span class="t-price">¥${esc(t.price)}</span><span class="t-moq">${esc(t.moq) || '—'}</span></div>`).join('');
      } else {
        priceHtml = `<div class="tier"><span class="t-price muted">${esc(t('quote'))}</span></div>`;
      }

      // 当前颜色首图；无颜色则用产品主图
      let curPhoto = '';
      if (color) {
        if (color.photos && color.photos.length) curPhoto = color.photos[0];
        else if (color.photo) curPhoto = color.photo;
      }
      if (!curPhoto) curPhoto = primaryPhoto(p);
      const photo = curPhoto
        ? `<div class="card-photo"><img loading="lazy" src="${imgUrl(curPhoto)}" alt="${esc(p.item)} ${esc(color ? color.name : '')}"></div>`
        : `<div class="card-photo ph"><div class="ph-icon">🍺</div></div>`;

      // 该产品的颜色一览（信息性，展平后不再卡内切换；高亮当前颜色）
      const colorDots = (p.colors && p.colors.length)
        ? `<div class="swatches">${p.colors.map(c =>
            `<span class="swatch ${c === color ? 'on' : ''}" style="background:${esc(c.hex || '#ccc')}" title="${esc(L(c.name || '颜色', c.name_en || ''))}"></span>${c.name ? `<span class="sw-label">${esc(L(c.name, c.name_en || ''))}</span>` : ''}`
          ).join('')}</div>`
        : '';

      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head"><span class="idx">#${String(vi + 1).padStart(2, '0')}</span>
          <span class="item">${esc(p.item)}</span>${color && color.name ? `<span class="cname">${esc(color.name)}</span>` : ''}</div>
        ${photo}
        ${colorDots}
        <div class="card-body">
          <div class="specs">${specHtml}</div>
          <div class="price-block">
            <div class="pb-title">${esc(L(C.priceLabel || '出厂价 (不含税)', C.priceLabel_en || 'Ex-works Price (excl. tax)'))}</div>
            ${p.priceHidden ? `<div class="tiers"><div class="tier"><span class="t-price muted">${esc(t('quote'))}</span></div></div>` : `<div class="tiers">${priceHtml}</div>`}
          </div>
        </div>`;
      // 点击产品图放大查看（含该产品全部视角/颜色图）
      const pImgs = collectProductPhotos(p);
      if(pImgs.length){
        const ph = card.querySelector('.card-photo');
        if(ph){ ph.classList.add('clickable'); ph.addEventListener('click', () => openLightbox(pImgs, 0)); }
      }
      grid.appendChild(card);
    });

    // ---- Gallery ----
    const galleryFiles = C.gallery && C.gallery.length ? C.gallery : [];
    document.getElementById('galleryLead').textContent =
      L(C.galleryLead || '产品实拍展示（点击查看大图）。共 {n} 张。', C.galleryLead_en || 'Real product photos (click to enlarge). {n} images in total.').replace(/\{n\}/g, galleryFiles.length);
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    const gItems = galleryFiles.map(fn => ({src: imgUrl(fn), alt: fn}));
    galleryFiles.forEach((fn, gi) => {
      const a = document.createElement('a');
      a.className = 'g-item';
      a.href = 'assets/photos/' + fn;
      a.innerHTML = `<img loading="lazy" src="assets/thumbs/${esc(fn)}" alt="${esc(fn)}">`;
      a.addEventListener('click', e => { e.preventDefault(); openLightbox(gItems, gi); });
      gallery.appendChild(a);
    });

    // ---- Footer ----
    document.getElementById('footer').innerHTML = `
      <div><b>${esc(b.name || '')}</b>${b.cn ? ' · ' + esc(b.cn) : ''}</div>
      <div style="margin-top:8px;">${[b.tel, b.fax, b.mob].filter(Boolean).map(esc).join(' &nbsp;|&nbsp; ')}</div>
      <div style="margin-top:8px;">${[b.web, b.email].filter(Boolean).map(esc).join(' &nbsp;|&nbsp; ')}</div>`;
    }

    window.__renderCatalog = renderCatalog;
    renderCatalog();
    buildLangBar(document.getElementById('langBar'));

    // ---- Lightbox（统一灯箱：点击放大、左右切换、ESC/点击关闭）----
    function openLightbox(items, idx){
      if(!items || !items.length) return;
      const ov = document.createElement('div');
      ov.className = 'lightbox';
      ov.innerHTML =
        '<span class="lb-close" title="'+esc(t('close'))+'">&times;</span>' +
        '<span class="lb-prev" title="'+esc(t('prev'))+'">&#8249;</span>' +
        '<img class="lb-img" alt="">' +
        '<span class="lb-next" title="'+esc(t('next'))+'">&#8250;</span>' +
        '<div class="lb-count"></div>';
      document.body.appendChild(ov);
      let i = idx || 0;
      const img = ov.querySelector('.lb-img');
      const count = ov.querySelector('.lb-count');
      function show(){
        const it = items[i];
        img.src = it.src; img.alt = it.alt || '';
        count.textContent = (i + 1) + ' / ' + items.length;
        const multi = items.length > 1;
        ov.querySelector('.lb-prev').style.display = multi ? '' : 'none';
        ov.querySelector('.lb-next').style.display = multi ? '' : 'none';
      }
      function close(){ ov.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e){
        if(e.key === 'Escape') close();
        else if(e.key === 'ArrowLeft'){ i = (i - 1 + items.length) % items.length; show(); }
        else if(e.key === 'ArrowRight'){ i = (i + 1) % items.length; show(); }
      }
      ov.querySelector('.lb-close').addEventListener('click', close);
      ov.querySelector('.lb-prev').addEventListener('click', e => { e.stopPropagation(); i = (i - 1 + items.length) % items.length; show(); });
      ov.querySelector('.lb-next').addEventListener('click', e => { e.stopPropagation(); i = (i + 1) % items.length; show(); });
      ov.addEventListener('click', e => { if(e.target === ov) close(); });
      document.addEventListener('keydown', onKey);
      show();
    }
  })();
  </script>
</body>
</html>
